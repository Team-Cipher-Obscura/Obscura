<!DOCTYPE html>
<html>

<head>
  <title>P6 Action Pipeline Test</title>
</head>

<body>

  <h1>P6 Action Pipeline Test</h1>

  <input
    data-agent-id="el_name"
    id="nameInput"
    placeholder="Name"
  >

  <p id="output">
    Nothing clicked yet.
  </p>

  <button
    data-agent-id="el_safe"
    id="safeButton"
  >
    Click Me
  </button>

  <button
    data-agent-id="el_delete"
    id="deleteButton"
  >
    Delete Account
  </button>

  <input
    data-agent-id="el_password"
    type="password"
  >

  <script type="module">

    import {
      processAction
    } from "../actionPipeline.js";

    import {
      update,
      _resetForTesting
    } from "../sensitiveRegistry.js";

    import {
      handleConfirmationResponse,
      _pendingCountForTesting
    } from "../confirmationFlow.js";


    _resetForTesting();


    // -----------------------------------------
    // Mock P3 sensitive information
    // -----------------------------------------

    update({
      sensitive_element_ids: [
        "el_password"
      ],

      types: {
        el_password:
          "password_field"
      }
    });


    // -----------------------------------------
    // Safe button behavior
    // -----------------------------------------

    document
      .getElementById("safeButton")
      .addEventListener(
        "click",
        () => {

          document
            .getElementById("output")
            .textContent =
            "Button clicked successfully.";

        }
      );


    const sentMessages = [];


    function sendMessage(message) {

      sentMessages.push(message);

      console.log(
        "P6 -> P1:",
        message
      );
    }


    // -----------------------------------------
    // 1. SAFE CLICK
    // -----------------------------------------

    const safeClick = {
      action: "click",
      target_id: "el_safe",
      confidence: 0.95,
      metadata: {}
    };


    const safeResult =
      await processAction(
        safeClick,
        {
          sendMessage
        }
      );


    console.assert(
      safeResult.status === "EXECUTED",
      "Safe click should execute"
    );


    // -----------------------------------------
    // 2. RISKY CLICK + APPROVAL
    // -----------------------------------------

    const deleteAction = {
      action: "click",
      target_id: "el_delete",
      confidence: 0.95,
      metadata: {}
    };


    const deletePromise =
      processAction(
        deleteAction,
        {
          sendMessage
        }
      );


    console.assert(
      _pendingCountForTesting() === 1,
      "Delete should wait for confirmation"
    );


    const request =
      sentMessages[
        sentMessages.length - 1
      ];


    console.assert(
      request.type ===
        "P6_CONFIRMATION_REQUEST",
      "Wrong confirmation request type"
    );


    console.assert(
      request.requestId,
      "Confirmation request must have requestId"
    );


    handleConfirmationResponse({
      type:
        "P6_CONFIRMATION_RESPONSE",

      requestId:
        request.requestId,

      approved: true
    });


    const deleteResult =
      await deletePromise;


    console.assert(
      deleteResult.status === "EXECUTED",
      "Approved risky action should execute"
    );


    console.assert(
      _pendingCountForTesting() === 0,
      "Approved confirmation should be removed"
    );


    // -----------------------------------------
    // 3. P3 SENSITIVE HARD BLOCK
    // -----------------------------------------

    const sensitiveAction = {
      action: "click",
      target_id: "el_password",
      confidence: 0.99,
      metadata: {}
    };


    const sensitiveResult =
      await processAction(
        sensitiveAction,
        {
          sendMessage
        }
      );


    console.assert(
      sensitiveResult.status === "BLOCKED",
      "P3-sensitive target MUST be blocked"
    );


    // -----------------------------------------
    // 4. UNKNOWN TARGET
    // -----------------------------------------

    const invalidAction = {
      action: "click",
      target_id: "el_missing",
      confidence: 0.95,
      metadata: {}
    };


    const invalidResult =
      await processAction(
        invalidAction,
        {
          sendMessage
        }
      );


    console.assert(
      invalidResult.status === "BLOCKED",
      "Unknown target should be blocked"
    );


    // -----------------------------------------
    // 5. SCROLL WITHOUT TARGET
    // -----------------------------------------

    const scrollAction = {
      action: "scroll",
      target_id: null,
      confidence: 0.90,

      metadata: {
        direction: "down",
        amount: 300
      }
    };


    const scrollResult =
      await processAction(
        scrollAction,
        {
          sendMessage
        }
      );


    console.assert(
      scrollResult.status === "EXECUTED",
      "Scroll should execute"
    );


    // -----------------------------------------
    // 6. USER REJECTION
    // -----------------------------------------

    const rejectionPromise =
      processAction(
        deleteAction,
        {
          sendMessage
        }
      );


    const rejectionRequest =
      sentMessages[
        sentMessages.length - 1
      ];


    handleConfirmationResponse({
      type:
        "P6_CONFIRMATION_RESPONSE",

      requestId:
        rejectionRequest.requestId,

      approved: false
    });


    const rejectionResult =
      await rejectionPromise;


    console.assert(
      rejectionResult.status ===
        "CONFIRMATION_REJECTED",
      "Rejected action must not execute"
    );


    console.assert(
      _pendingCountForTesting() === 0,
      "Rejected confirmation should be removed"
    );


    // -----------------------------------------
    // COMPLETE
    // -----------------------------------------

    console.log(
      "===================================="
    );

    console.log(
      "P6 Action Pipeline tests completed."
    );

    console.log(
      "===================================="
    );

  </script>

</body>
</html>
