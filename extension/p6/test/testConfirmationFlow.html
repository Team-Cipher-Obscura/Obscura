<!DOCTYPE html>
<html>

<head>
  <title>P6 Confirmation Flow Test</title>
</head>

<body>

  <h1>P6 Confirmation Flow Test</h1>


  <script type="module">

    import {
      requestConfirmation,
      handleConfirmationResponse,
      _pendingCountForTesting
    } from "../confirmationFlow.js";


    const sentMessages = [];


    function sendMessage(message) {

      console.log(
        "P6 -> P1:",
        message
      );

      sentMessages.push(message);
    }


    // -----------------------------------------
    // 1. APPROVAL
    // -----------------------------------------

    const confirmationPromise =
      requestConfirmation({
        sendMessage,

        action: {
          action: "click",
          target_id: "el_delete",
          confidence: 0.95,
          metadata: {}
        },

        targetSummary:
          "Delete Account"
      });


    console.assert(
      _pendingCountForTesting() === 1,
      "One confirmation should be pending"
    );


    console.assert(
      sentMessages.length === 1,
      "P6 should send one confirmation request"
    );


    const request =
      sentMessages[0];


    console.assert(
      request.type ===
        "P6_CONFIRMATION_REQUEST",
      "Wrong confirmation message type"
    );


    console.assert(
      request.requestId,
      "Confirmation request should have requestId"
    );


    handleConfirmationResponse({
      type:
        "P6_CONFIRMATION_RESPONSE",

      requestId:
        request.requestId,

      approved: true
    });


    const approved =
      await confirmationPromise;


    console.assert(
      approved === true,
      "Approval should resolve to true"
    );


    console.assert(
      _pendingCountForTesting() === 0,
      "Approved confirmation should be removed"
    );


    // -----------------------------------------
    // 2. REJECTION
    // -----------------------------------------

    const rejectionPromise =
      requestConfirmation({
        sendMessage,

        action: {
          action: "click",
          target_id: "el_delete",
          confidence: 0.95,
          metadata: {}
        },

        targetSummary:
          "Delete Account"
      });


    const rejectionRequest =
      sentMessages[
        sentMessages.length - 1
      ];


    handleConfirmationResponse({
      type:
        "P6_CONFIRMATION_RESPONSE",

      requestId:
        rejectionRequest.requestId,

      approved: false
    });


    const rejected =
      await rejectionPromise;


    console.assert(
      rejected === false,
      "Rejection should resolve to false"
    );


    console.assert(
      _pendingCountForTesting() === 0,
      "Rejected confirmation should be removed"
    );


    // -----------------------------------------
    // 3. UNKNOWN REQUEST ID
    // -----------------------------------------

    handleConfirmationResponse({
      type:
        "P6_CONFIRMATION_RESPONSE",

      requestId:
        "does-not-exist",

      approved: true
    });


    console.assert(
      _pendingCountForTesting() === 0,
      "Unknown confirmation response must be ignored"
    );


    // -----------------------------------------
    // 4. INVALID MESSAGE
    // -----------------------------------------

    handleConfirmationResponse({
      type: "UNRELATED_MESSAGE",
      requestId: "anything",
      approved: true
    });


    console.assert(
      _pendingCountForTesting() === 0,
      "Unrelated messages must be ignored"
    );


    // -----------------------------------------
    // 5. TIMEOUT
    // -----------------------------------------
    //
    // Use a short timeout only for this test.
    // Production processAction() continues to use
    // the 30-second default.
    //

    const timeoutPromise =
      requestConfirmation({
        sendMessage,

        action: {
          action: "click",
          target_id: "el_delete",
          confidence: 0.95,
          metadata: {}
        },

        targetSummary:
          "Delete Account",

        timeoutMs: 10
      });


    console.assert(
      _pendingCountForTesting() === 1,
      "Timeout request should be pending"
    );


    const timeoutResult =
      await timeoutPromise;


    console.log(
      "Confirmation timeout:",
      timeoutResult
    );


    console.assert(
      timeoutResult === false,
      "Timeout should resolve to false"
    );


    console.assert(
      _pendingCountForTesting() === 0,
      "Timed-out confirmation should be removed"
    );


    // -----------------------------------------
    // COMPLETE
    // -----------------------------------------

    console.log(
      "===================================="
    );

    console.log(
      "P6 Confirmation Flow tests completed."
    );

    console.log(
      "===================================="
    );

  </script>

</body>

</html>
