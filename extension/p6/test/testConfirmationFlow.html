<!DOCTYPE html>
<html>

<head>
  <title>P6 Confirmation Flow Test</title>
</head>

<body>

  <h1>P6 Confirmation Flow Test</h1>

  <script type="module">

    import {
      requestConfirmation,
      handleConfirmationResponse,
      _pendingCountForTesting
    } from "../confirmationFlow.js";


    // -----------------------------------------
    // Mock message sender
    // -----------------------------------------

    const sentMessages = [];

    function sendMessage(message) {

      console.log(
        "P6 → P1:",
        message
      );

      sentMessages.push(message);
    }


    // -----------------------------------------
    // Start confirmation request
    // -----------------------------------------

    const confirmationPromise =
      requestConfirmation({
        sendMessage,

        action: {
          action: "click",
          target_id: "el_delete",
          confidence: 0.95,
          metadata: {}
        },

        targetSummary: "Delete Account"
      });


    console.assert(
      _pendingCountForTesting() === 1,
      "One confirmation should be pending"
    );


    // -----------------------------------------
    // Check message sent to P1
    // -----------------------------------------

    console.assert(
      sentMessages.length === 1,
      "P6 should send one confirmation request"
    );


    const request =
      sentMessages[0];


    console.assert(
      request.type === "P6_CONFIRMATION_REQUEST",
      "Wrong confirmation message type"
    );


    console.assert(
      request.requestId,
      "Confirmation request should have requestId"
    );


    console.log(
      "Confirmation request:",
      request
    );


    // -----------------------------------------
    // Simulate P1 → P6 approval
    // -----------------------------------------

    handleConfirmationResponse({
      type: "P6_CONFIRMATION_RESPONSE",

      requestId:
        request.requestId,

      approved: true
    });


    const approved =
      await confirmationPromise;


    console.log(
      "User approval:",
      approved
    );


    console.assert(
      approved === true,
      "Approval should resolve to true"
    );


    console.assert(
      _pendingCountForTesting() === 0,
      "Pending confirmation should be removed"
    );


    //rejection test
    const rejectionPromise =
    requestConfirmation({
        sendMessage,

        action: {
        action: "click",
        target_id: "el_delete",
        confidence: 0.95,
        metadata: {}
        },

        targetSummary: "Delete Account"
    });

    const rejectionRequest =
    sentMessages[sentMessages.length - 1];

    handleConfirmationResponse({
    type: "P6_CONFIRMATION_RESPONSE",
    requestId: rejectionRequest.requestId,
    approved: false
    });

    const rejected =
    await rejectionPromise;

    console.log(
    "User rejection:",
    rejected
    );

    console.assert(
    rejected === false,
    "Rejection should resolve to false"
    );

    console.assert(
    _pendingCountForTesting() === 0,
    "Rejected confirmation should be removed"
    );

    //timeout test
    const timeoutPromise =
    requestConfirmation({
        sendMessage,
        action: {
        action: "click",
        target_id: "el_delete",
        confidence: 0.95,
        metadata: {}
        },
        targetSummary: "Delete Account"
    });

    const timeoutResult =
    await timeoutPromise;

    console.log("Confirmation timeout:", timeoutResult);

    console.assert(
    timeoutResult === false,
    "Timeout should resolve to false"
    );

    console.assert(
    _pendingCountForTesting() === 0,
    "Timed-out confirmation should be removed"
    );

    console.log(
      "===================================="
    );

    console.log(
      "P6 Confirmation Flow test completed."
    );

    console.log(
      "===================================="
    );

  </script>

</body>

</html>
