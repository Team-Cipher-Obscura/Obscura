<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>P6 Confirmation Integration Test</title>
</head>

<body>

  <h1>P6 Confirmation Integration Test</h1>

  <button
    data-agent-id="el_delete"
    id="deleteButton"
  >
    Delete Account
  </button>

  <button
    data-agent-id="el_submit"
    id="submitButton"
  >
    Submit Order
  </button>

  <input
    data-agent-id="el_password"
    id="password"
    type="password"
  >

  <script type="module">

    import {
      processAction
    } from "../actionPipeline.js";

    import {
      handleConfirmationResponse,
      _pendingCountForTesting
    } from "../confirmationFlow.js";

    import {
      update
    } from "../sensitiveRegistry.js";


    function assert(
      condition,
      message
    ) {
      console.assert(
        condition,
        message
      );

      if (!condition) {
        throw new Error(message);
      }
    }


    // -----------------------------------------
    // P3 sensitive map
    // -----------------------------------------

    update({
      sensitive_element_ids: [
        "el_password"
      ],

      types: {
        el_password:
          "password_field"
      }
    });


    // -----------------------------------------
    // Confirmation message transport
    // -----------------------------------------

    const sentMessages = [];

    function sendMessage(message) {
      sentMessages.push(message);
    }


    // -----------------------------------------
    // 1. RISKY ACTION MUST REQUEST CONFIRMATION
    // -----------------------------------------

    const deleteAction = {
      action: "click",
      target_id: "el_delete",
      confidence: 0.95,
      metadata: {}
    };


    const deletePromise =
      processAction(
        deleteAction,
        sendMessage
      );


    await new Promise(
      (resolve) =>
        setTimeout(resolve, 0)
    );


    assert(
      sentMessages.length === 1,
      "Risky action must send exactly one confirmation request"
    );


    const request =
      sentMessages[0];


    assert(
      request.type ===
        "P6_CONFIRMATION_REQUEST",
      "Confirmation request must use P6 message type"
    );


    assert(
      request.requestId,
      "Confirmation request must contain requestId"
    );


    assert(
      request.action.action ===
        "click",
      "Confirmation request should contain the action"
    );


    assert(
      request.action.target_id ===
        "el_delete",
      "Confirmation request should contain target_id"
    );


    assert(
      request.targetSummary ===
        "Delete Account",
      "Confirmation summary should be privacy-safe and user-readable"
    );


    assert(
      _pendingCountForTesting() === 1,
      "Confirmation should remain pending until P1 responds"
    );


    // -----------------------------------------
    // 2. APPROVE
    // -----------------------------------------

    handleConfirmationResponse({
      type:
        "P6_CONFIRMATION_RESPONSE",

      requestId:
        request.requestId,

      approved: true
    });


    const approvedResult =
      await deletePromise;


    console.log(
      "Approved result:",
      approvedResult
    );


    assert(
      approvedResult.status ===
        "EXECUTED",
      "Approved risky action should execute"
    );


    assert(
      _pendingCountForTesting() === 0,
      "Approved request must be removed from pending map"
    );


    // -----------------------------------------
    // 3. REJECTION
    // -----------------------------------------

    sentMessages.length = 0;


    const rejectionPromise =
      processAction(
        deleteAction,
        sendMessage
      );


    await new Promise(
      (resolve) =>
        setTimeout(resolve, 0)
    );


    const rejectionRequest =
      sentMessages[0];


    assert(
      rejectionRequest,
      "Second risky action must request confirmation"
    );


    handleConfirmationResponse({
      type:
        "P6_CONFIRMATION_RESPONSE",

      requestId:
        rejectionRequest.requestId,

      approved: false
    });


    const rejectedResult =
      await rejectionPromise;


    console.log(
      "Rejected result:",
      rejectedResult
    );


    assert(
      rejectedResult.status ===
        "BLOCKED",
      "Rejected action must be blocked"
    );


    assert(
      rejectedResult.reason ===
        "CONFIRMATION_REJECTED",
      "Rejected action should expose confirmation rejection"
    );


    // -----------------------------------------
    // 4. P3 BLOCK MUST WIN
    //
    // Start confirmation first, then make the
    // target sensitive before approving.
    // -----------------------------------------

    sentMessages.length = 0;


    const submitAction = {
      action: "click",
      target_id: "el_submit",
      confidence: 0.95,
      metadata: {}
    };


    const submitPromise =
      processAction(
        submitAction,
        sendMessage
      );


    await new Promise(
      (resolve) =>
        setTimeout(resolve, 0)
    );


    const submitRequest =
      sentMessages[0];


    assert(
      submitRequest,
      "Submit action should request confirmation"
    );


    // P3 changes its classification while the
    // confirmation dialog is open.
    update({
      sensitive_element_ids: [
        "el_password",
        "el_submit"
      ],

      types: {
        el_password:
          "password_field",

        el_submit:
          "sensitive_action"
      }
    });


    // User approves, but the fresh safety gate
    // must still block.
    handleConfirmationResponse({
      type:
        "P6_CONFIRMATION_RESPONSE",

      requestId:
        submitRequest.requestId,

      approved: true
    });


    const submitResult =
      await submitPromise;


    console.log(
      "TOCTOU/P3 result:",
      submitResult
    );


    assert(
      submitResult.status ===
        "BLOCKED",
      "Fresh P3 sensitive veto must win after approval"
    );


    assert(
      submitResult.detail ===
        "SENSITIVE_ELEMENT_BLOCKED",
      "Fresh safety check should report P3 block"
    );


    console.log(
      "===================================="
    );

    console.log(
      "P6 Confirmation Integration tests passed."
    );

    console.log(
      "===================================="
    );

  </script>

</body>

</html>
