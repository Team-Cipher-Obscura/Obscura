<!DOCTYPE html>
<html>

<head>
  <title>P6 Confirmation Integration Test</title>
</head>

<body>

  <h1>P6 Confirmation Integration Test</h1>

  <button
    id="deleteButton"
    data-agent-id="el_delete"
  >
    Delete Account
  </button>

  <button
    id="replaceButton"
    data-agent-id="el_replace"
  >
    Replace Me
  </button>

  <button
    id="sensitiveButton"
    data-agent-id="el_sensitive"
  >
    Delete Sensitive Account
  </button>


  <script type="module">

    import {
      processAction
    } from "../actionPipeline.js";

    import {
      handleConfirmationResponse,
      _pendingCountForTesting
    } from "../confirmationFlow.js";

    import {
      update,
      _resetForTesting
    } from "../sensitiveRegistry.js";


    function createSender(messages) {

      return (message) => {
        messages.push(message);
      };

    }


    async function testApproval() {

      console.log(
        "TEST 1: approval -> fresh safety -> execution"
      );


      _resetForTesting();


      const messages = [];


      const action = {
        action: "click",
        target_id: "el_delete",
        confidence: 0.95,
        metadata: {}
      };


      const promise =
        processAction(
          action,
          {
            sendMessage:
              createSender(messages)
          }
        );


      console.assert(
        _pendingCountForTesting() === 1,
        "Confirmation should be pending"
      );


      const request =
        messages[0];


      console.assert(
        request.type ===
          "P6_CONFIRMATION_REQUEST",
        "Expected confirmation request"
      );


      handleConfirmationResponse({
        type:
          "P6_CONFIRMATION_RESPONSE",

        requestId:
          request.requestId,

        approved: true
      });


      const result =
        await promise;


      console.log(
        "Approval result:",
        result
      );


      console.assert(
        result.status === "EXECUTED",
        "Approved risky action should execute"
      );


      console.assert(
        _pendingCountForTesting() === 0,
        "No confirmation should remain pending"
      );

    }


    async function testDomReplacement() {

      console.log(
        "TEST 2: DOM replacement while confirmation pending"
      );


      _resetForTesting();


      const messages = [];


      const action = {
        action: "click",
        target_id: "el_replace",
        confidence: 0.95,
        metadata: {}
      };


      const promise =
        processAction(
          action,
          {
            sendMessage:
              createSender(messages)
          }
        );


      console.assert(
        _pendingCountForTesting() === 1,
        "Confirmation should be pending"
      );


      const oldElement =
        document.querySelector(
          '[data-agent-id="el_replace"]'
        );


      console.assert(
        oldElement !== null,
        "Original target should exist"
      );


      // The page changes while the user is deciding.
      oldElement.remove();


      const replacement =
        document.createElement("button");


      replacement.id =
        "replacementButton";


      replacement.textContent =
        "Replacement Button";


      replacement.setAttribute(
        "data-agent-id",
        "el_replace_new"
      );


      document.body.appendChild(
        replacement
      );


      const request =
        messages[0];


      handleConfirmationResponse({
        type:
          "P6_CONFIRMATION_RESPONSE",

        requestId:
          request.requestId,

        approved: true
      });


      const result =
        await promise;


      console.log(
        "DOM replacement result:",
        result
      );


      console.assert(
        result.status === "BLOCKED",
        "Old target must be blocked after replacement"
      );


      console.assert(
        result.reason ===
          "TARGET_COULD_NOT_BE_RESOLVED",
        "Expected fresh target-resolution failure"
      );

    }


    async function testP3Update() {

      console.log(
        "TEST 3: P3 marks target sensitive while confirmation pending"
      );


      _resetForTesting();


      const messages = [];


      const action = {
        action: "click",
        target_id: "el_sensitive",
        confidence: 0.95,
        metadata: {}
      };


      const promise =
        processAction(
          action,
          {
            sendMessage:
              createSender(messages)
          }
        );


      console.assert(
        _pendingCountForTesting() === 1,
        "Confirmation should be pending"
      );


      // P3 changes its verdict before approval.
      update({
        sensitive_element_ids: [
          "el_sensitive"
        ],

        types: {
          el_sensitive:
            "account_sensitive_data"
        }
      });


      const request =
        messages[0];


      handleConfirmationResponse({
        type:
          "P6_CONFIRMATION_RESPONSE",

        requestId:
          request.requestId,

        approved: true
      });


      const result =
        await promise;


      console.log(
        "P3 update result:",
        result
      );


      console.assert(
        result.status === "BLOCKED",
        "P3 hard veto must win after approval"
      );


      console.assert(
        result.reason.includes(
          "P3 flagged target as sensitive"
        ),
        "Expected P3 sensitive-element reason"
      );

    }


    async function testRejection() {

      console.log(
        "TEST 4: explicit rejection"
      );


      _resetForTesting();


      const messages = [];


      const action = {
        action: "click",
        target_id: "el_delete",
        confidence: 0.95,
        metadata: {}
      };


      const promise =
        processAction(
          action,
          {
            sendMessage:
              createSender(messages)
          }
        );


      const request =
        messages[0];


      handleConfirmationResponse({
        type:
          "P6_CONFIRMATION_RESPONSE",

        requestId:
          request.requestId,

        approved: false
      });


      const result =
        await promise;


      console.assert(
        result.status ===
          "CONFIRMATION_REJECTED",
        "Rejection must not execute"
      );

    }


    async function testTimeout() {

      console.log(
        "TEST 5: confirmation timeout"
      );


      _resetForTesting();


      const messages = [];


      const action = {
        action: "click",
        target_id: "el_delete",
        confidence: 0.95,
        metadata: {}
      };


      /*
       * The production timeout is 30 seconds.
       *
       * This test cannot inject timeoutMs through
       * processAction(), so it verifies the timeout
       * behavior separately through requestConfirmation
       * in testConfirmationFlow.html.
       *
       * This integration test verifies that processAction
       * remains pending until the confirmation layer resolves.
       */
      const promise =
        processAction(
          action,
          {
            sendMessage:
              createSender(messages)
          }
        );


      console.assert(
        _pendingCountForTesting() === 1,
        "Confirmation should remain pending"
      );


      const request =
        messages[0];


      // Resolve the pending request as a timeout-equivalent
      // denial. The confirmation layer's dedicated test
      // verifies the actual timer expiration.
      handleConfirmationResponse({
        type:
          "P6_CONFIRMATION_RESPONSE",

        requestId:
          request.requestId,

        approved: false
      });


      const result =
        await promise;


      console.assert(
        result.status ===
          "CONFIRMATION_REJECTED",
        "Denied confirmation must not execute"
      );

    }


    async function runTests() {

      await testApproval();

      await testDomReplacement();

      await testP3Update();

      await testRejection();

      await testTimeout();


      console.assert(
        _pendingCountForTesting() === 0,
        "All confirmation requests should be resolved"
      );


      console.log(
        "===================================="
      );

      console.log(
        "P6 Confirmation Integration tests completed."
      );

      console.log(
        "===================================="
      );

    }


    runTests().catch((error) => {

      console.error(
        "Confirmation integration test failed:",
        error
      );

    });

  </script>

</body>
</html>
