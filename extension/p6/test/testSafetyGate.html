<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>P6 Safety Gate Test</title>
</head>

<body>

  <h1>P6 Safety Gate Test</h1>

  <input
    data-agent-id="el_name"
    placeholder="Name"
  >

  <button data-agent-id="el_submit">
    Submit
  </button>

  <button data-agent-id="el_delete">
    Delete Account
  </button>

  <button data-agent-id="el_wireless">
    Wireless Settings
  </button>

  <button data-agent-id="el_transfer">
    Wire Transfer
  </button>

  <input
    data-agent-id="el_new_password"
    type="password"
    autocomplete="new-password"
  >

  <input
    data-agent-id="el_password"
    type="password"
  >


  <script type="module">

    import {
      evaluateAction,
      isAllowedNavigationUrl,
      SUPPORTED_ACTIONS
    } from "../safetyGate.js";

    import {
      update
    } from "../sensitiveRegistry.js";

    import {
      mockP3Payload
    } from "../mock/p3Payload.js";

    import {
      mockActions
    } from "../mock/p5Actions.js";


    // ==================================================
    // Test helpers
    // ==================================================

    let passed = 0;
    let failed = 0;


    function assert(
      condition,
      message
    ) {

      if (condition) {
        passed++;

        console.log(
          `PASS: ${message}`
        );

      } else {
        failed++;

        console.error(
          `FAIL: ${message}`
        );
      }

      console.assert(
        condition,
        message
      );
    }


    function assertEqual(
      actual,
      expected,
      message
    ) {

      assert(
        actual === expected,
        `${message} | expected=${expected}, actual=${actual}`
      );
    }


    // ==================================================
    // Load P3 sensitive-element information
    // ==================================================

    update(mockP3Payload);


    // ==================================================
    // 1. Supported action allowlist
    // ==================================================

    assert(
      SUPPORTED_ACTIONS.has("click"),
      "click is supported"
    );

    assert(
      SUPPORTED_ACTIONS.has("type"),
      "type is supported"
    );

    assert(
      SUPPORTED_ACTIONS.has("scroll"),
      "scroll is supported"
    );

    assert(
      SUPPORTED_ACTIONS.has("navigate"),
      "navigate is supported"
    );

    assert(
      SUPPORTED_ACTIONS.has("wait"),
      "wait is supported"
    );

    assert(
      !SUPPORTED_ACTIONS.has("delete"),
      "delete is not a literal action type"
    );

    assert(
      !SUPPORTED_ACTIONS.has("purchase"),
      "purchase is not a literal action type"
    );


    // ==================================================
    // 2. Safe click
    // ==================================================

    const safe =
      evaluateAction(
        mockActions.safeClick
      );

    console.log(
      "Safe click:",
      safe
    );

    assertEqual(
      safe.decision,
      "EXECUTE",
      "Safe click should EXECUTE"
    );


    // ==================================================
    // 3. Risky submit
    // ==================================================

    const submit =
      evaluateAction(
        mockActions.riskySubmitClick
      );

    console.log(
      "Risky submit:",
      submit
    );

    assertEqual(
      submit.decision,
      "CONFIRM",
      "Submit should require confirmation"
    );

    assertEqual(
      submit.reason,
      "RISKY_ACTION",
      "Submit should have RISKY_ACTION reason"
    );


    // ==================================================
    // 4. Risky delete
    // ==================================================

    const deleteAction =
      evaluateAction(
        mockActions.riskyDeleteClick
      );

    console.log(
      "Risky delete:",
      deleteAction
    );

    assertEqual(
      deleteAction.decision,
      "CONFIRM",
      "Delete should require confirmation"
    );


    // ==================================================
    // 5. Password typing
    // ==================================================

    const password =
      evaluateAction(
        mockActions.passwordTyping
      );

    console.log(
      "Password typing:",
      password
    );

    assertEqual(
      password.decision,
      "CONFIRM",
      "Password typing should require confirmation"
    );


    // ==================================================
    // 6. Safe navigation
    // ==================================================

    const navigationAction = {
      action: "navigate",
      target_id: null,
      confidence: 0.95,
      metadata: {
        url: "https://example.com"
      }
    };


    const navigation =
      evaluateAction(
        navigationAction
      );

    console.log(
      "Navigation:",
      navigation
    );

    assertEqual(
      navigation.decision,
      "CONFIRM",
      "Safe HTTP(S) navigation should require confirmation"
    );

    assertEqual(
      navigation.status,
      "CONFIRMATION_REQUIRED",
      "Safe navigation should enter confirmation state"
    );

    // ==================================================
// REGRESSION: navigate must not carry target_id
// ==================================================

const navigationWithTarget = {
  action: "navigate",
  target_id: "el_something",
  confidence: 0.95,
  metadata: {
    url: "https://example.com"
  }
};


const navigationWithTargetResult =
  evaluateAction(
    navigationWithTarget
  );


console.log(
  "Navigation with stray target_id:",
  navigationWithTargetResult
);


assertEqual(
  navigationWithTargetResult.decision,
  "BLOCK",
  "Navigate with a target_id must be blocked"
);

assertEqual(
  navigationWithTargetResult.status,
  "INVALID_ACTION",
  "Navigate with a target_id must return INVALID_ACTION"
);


    // ==================================================
    // 7. P3 hard veto
    // ==================================================

    const sensitive =
      evaluateAction(
        mockActions.sensitiveOverrideClick
      );

    console.log(
      "Sensitive override:",
      sensitive
    );

    assertEqual(
      sensitive.decision,
      "BLOCK",
      "P3-sensitive target MUST be blocked"
    );

    assertEqual(
      sensitive.status,
      "SENSITIVE_ELEMENT_BLOCKED",
      "P3-sensitive target should have explicit block status"
    );


    // ==================================================
    // 8. Wireless false-positive check
    // ==================================================

    const wirelessAction = {
      action: "click",
      target_id: "el_wireless",
      confidence: 0.9,
      metadata: {}
    };


    const transferAction = {
      action: "click",
      target_id: "el_transfer",
      confidence: 0.9,
      metadata: {}
    };


    const wirelessResult =
      evaluateAction(
        wirelessAction
      );

    const transferResult =
      evaluateAction(
        transferAction
      );


    console.log(
      "Wireless Settings:",
      wirelessResult
    );

    console.log(
      "Wire Transfer:",
      transferResult
    );


    assertEqual(
      wirelessResult.decision,
      "EXECUTE",
      "Wireless Settings should NOT be considered risky"
    );

    assertEqual(
      transferResult.decision,
      "CONFIRM",
      "Wire Transfer should require confirmation"
    );


    // ==================================================
    // 9. Click without target
    // ==================================================

    const invalidClick = {
      action: "click",
      target_id: null,
      confidence: 0.99,
      metadata: {}
    };


    const invalidClickResult =
      evaluateAction(
        invalidClick
      );


    console.log(
      "Click without target:",
      invalidClickResult
    );


    assertEqual(
      invalidClickResult.decision,
      "BLOCK",
      "Click without target should BLOCK"
    );

    assertEqual(
      invalidClickResult.reason,
      "TARGET_ID_REQUIRED",
      "Click without target should explain the failure"
    );


    // ==================================================
    // 10. Type without target
    // ==================================================

    const invalidType = {
      action: "type",
      target_id: null,
      confidence: 0.99,
      metadata: {
        value: "hello"
      }
    };


    const invalidTypeResult =
      evaluateAction(
        invalidType
      );


    console.log(
      "Type without target:",
      invalidTypeResult
    );


    assertEqual(
      invalidTypeResult.decision,
      "BLOCK",
      "Type without target should BLOCK"
    );

    assertEqual(
      invalidTypeResult.reason,
      "TARGET_ID_REQUIRED",
      "Type without target should explain the failure"
    );


    // ==================================================
    // 11. Scroll without target
    // ==================================================

    const scrollAction = {
      action: "scroll",
      target_id: null,
      confidence: 0.95,
      metadata: {
        direction: "down",
        amount: 500
      }
    };


    const scrollResult =
      evaluateAction(
        scrollAction
      );


    console.log(
      "Scroll:",
      scrollResult
    );


    assertEqual(
      scrollResult.decision,
      "EXECUTE",
      "Scroll should EXECUTE without a DOM target"
    );


    // ==================================================
    // 12. Wait without target
    // ==================================================

    const waitAction = {
      action: "wait",
      target_id: null,
      confidence: 0.95,
      metadata: {}
    };


    const waitResult =
      evaluateAction(
        waitAction
      );


    console.log(
      "Wait:",
      waitResult
    );


    assertEqual(
      waitResult.decision,
      "EXECUTE",
      "Wait should EXECUTE without a DOM target"
    );


    // ==================================================
    // 13. REGRESSION: unsupported action type
    // ==================================================

    const unsupportedAction = {
      action: "dance",
      target_id: null,
      confidence: 0.95,
      metadata: {}
    };


    const unsupportedResult =
      evaluateAction(
        unsupportedAction
      );


    console.log(
      "Unsupported action:",
      unsupportedResult
    );


    assertEqual(
      unsupportedResult.decision,
      "BLOCK",
      "Unsupported action must be blocked at the safety gate"
    );

    assertEqual(
      unsupportedResult.status,
      "UNSUPPORTED_ACTION",
      "Unsupported action must have explicit status"
    );


    // ==================================================
    // 14. REGRESSION: malformed metadata
    // ==================================================

    const malformedMetadataAction = {
      action: "click",
      target_id: "el_name",
      confidence: 0.95,
      metadata: null
    };


    const malformedMetadataResult =
      evaluateAction(
        malformedMetadataAction
      );


    console.log(
      "Malformed metadata:",
      malformedMetadataResult
    );


    assertEqual(
      malformedMetadataResult.decision,
      "BLOCK",
      "Malformed metadata must be blocked"
    );

    assertEqual(
      malformedMetadataResult.status,
      "INVALID_METADATA",
      "Malformed metadata must have explicit status"
    );


    // ==================================================
    // 15. REGRESSION: navigation missing URL
    // ==================================================

    const missingUrlAction = {
      action: "navigate",
      target_id: null,
      confidence: 0.95,
      metadata: {}
    };


    const missingUrlResult =
      evaluateAction(
        missingUrlAction
      );


    console.log(
      "Missing navigation URL:",
      missingUrlResult
    );


    assertEqual(
      missingUrlResult.decision,
      "BLOCK",
      "Navigation without URL must BLOCK before confirmation"
    );

    assertEqual(
      missingUrlResult.status,
      "NAVIGATION_URL_REQUIRED",
      "Missing navigation URL must have explicit status"
    );


    // ==================================================
    // 16. REGRESSION: javascript: URL
    // ==================================================

    const javascriptNavigation = {
      action: "navigate",
      target_id: null,
      confidence: 0.95,
      metadata: {
        url: "javascript:alert(1)"
      }
    };


    const javascriptResult =
      evaluateAction(
        javascriptNavigation
      );


    console.log(
      "javascript: navigation:",
      javascriptResult
    );


    assertEqual(
      javascriptResult.decision,
      "BLOCK",
      "javascript: navigation must BLOCK at safety gate"
    );

    assertEqual(
      javascriptResult.status,
      "UNSAFE_NAVIGATION_BLOCKED",
      "javascript: navigation must have explicit safety status"
    );


    // ==================================================
    // 17. data: URL
    // ==================================================

    const dataNavigation = {
      action: "navigate",
      target_id: null,
      confidence: 0.95,
      metadata: {
        url: "data:text/html,<h1>Hello</h1>"
      }
    };


    const dataResult =
      evaluateAction(
        dataNavigation
      );


    assertEqual(
      dataResult.decision,
      "BLOCK",
      "data: navigation must BLOCK at safety gate"
    );

    assertEqual(
      dataResult.status,
      "UNSAFE_NAVIGATION_BLOCKED",
      "data: navigation must have explicit safety status"
    );


    // ==================================================
    // 18. file: URL
    // ==================================================

    const fileNavigation = {
      action: "navigate",
      target_id: null,
      confidence: 0.95,
      metadata: {
        url: "file:///etc/passwd"
      }
    };


    const fileResult =
      evaluateAction(
        fileNavigation
      );


    assertEqual(
      fileResult.decision,
      "BLOCK",
      "file: navigation must BLOCK at safety gate"
    );

    assertEqual(
      fileResult.status,
      "UNSAFE_NAVIGATION_BLOCKED",
      "file: navigation must have explicit safety status"
    );


    // ==================================================
    // 19. ftp: URL
    // ==================================================

    const ftpNavigation = {
      action: "navigate",
      target_id: null,
      confidence: 0.95,
      metadata: {
        url: "ftp://example.com"
      }
    };


    const ftpResult =
      evaluateAction(
        ftpNavigation
      );


    assertEqual(
      ftpResult.decision,
      "BLOCK",
      "ftp: navigation must BLOCK at safety gate"
    );

    assertEqual(
      ftpResult.status,
      "UNSAFE_NAVIGATION_BLOCKED",
      "ftp: navigation must have explicit safety status"
    );


    // ==================================================
    // 20. Direct URL helper checks
    // ==================================================

    assert(
      isAllowedNavigationUrl(
        "https://example.com"
      ) === true,
      "HTTPS URL should be allowed"
    );


    assert(
      isAllowedNavigationUrl(
        "http://example.com"
      ) === true,
      "HTTP URL should be allowed"
    );


    assert(
      isAllowedNavigationUrl(
        "javascript:alert(1)"
      ) === false,
      "javascript: URL should be rejected"
    );


    assert(
      isAllowedNavigationUrl(
        "data:text/html,<h1>Hello</h1>"
      ) === false,
      "data: URL should be rejected"
    );


    assert(
      isAllowedNavigationUrl(
        "file:///etc/passwd"
      ) === false,
      "file: URL should be rejected"
    );


    assert(
      isAllowedNavigationUrl(
        "ftp://example.com"
      ) === false,
      "ftp: URL should be rejected"
    );


    assert(
      isAllowedNavigationUrl(
        ""
      ) === false,
      "Empty URL should be rejected"
    );


    assert(
      isAllowedNavigationUrl(
        "not a valid URL"
      ) === false,
      "Malformed URL should be rejected"
    );


    // ==================================================
    // 21. Confirmation re-check behavior
    // ==================================================

    const riskyConfirmed =
      evaluateAction(
        mockActions.riskySubmitClick,
        {
          confirmationGranted: true
        }
      );


    console.log(
      "Risky action after approval:",
      riskyConfirmed
    );


    assertEqual(
      riskyConfirmed.decision,
      "EXECUTE",
      "Approved risky action should EXECUTE after fresh safety evaluation"
    );

    assert(
      riskyConfirmed.element !== null,
      "Approved risky action must still resolve a fresh target"
    );


    // ==================================================
    // 22. Confirmation does NOT bypass unsafe navigation
    // ==================================================

    const unsafeNavigationApproved =
      evaluateAction(
        javascriptNavigation,
        {
          confirmationGranted: true
        }
      );


    console.log(
      "Unsafe navigation after approval:",
      unsafeNavigationApproved
    );


    assertEqual(
      unsafeNavigationApproved.decision,
      "BLOCK",
      "Confirmation must never override unsafe navigation validation"
    );

    assertEqual(
      unsafeNavigationApproved.status,
      "UNSAFE_NAVIGATION_BLOCKED",
      "Unsafe navigation must remain blocked after approval"
    );


    // ==================================================
    // Final result
    // ==================================================

    console.log(
      "----------------------------------------"
    );

    console.log(
      `P6 Safety Gate Tests: ${passed} passed, ${failed} failed`
    );

    console.log(
      "----------------------------------------"
    );


    if (failed === 0) {
      console.log(
        "ALL P6 SAFETY GATE TESTS PASSED."
      );
    } else {
      console.error(
        "P6 SAFETY GATE TESTS FAILED."
      );
    }

  </script>

</body>
</html>
