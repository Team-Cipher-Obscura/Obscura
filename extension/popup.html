<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obscura</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>

  <div class="popup">

    <!-- HEADER -->
    <header class="header">

      <div class="brand">

        <div class="logo-box">
          <img
            id="obscura-logo"
            class="logo"
            alt="Obscura"
          >
        </div>

        <div class="brand-text">
          <div class="brand-title">
            Obscura
          </div>

          <div class="brand-subtitle">
            Privacy-preserving browser agent
          </div>
        </div>

      </div>

      <div
        id="header-dot"
        class="header-dot"
      ></div>

    </header>


    <!-- TASK -->
    <section class="task-section">

      <label
        class="task-label"
        for="task-input"
      >
        Task
      </label>

      <input
        id="task-input"
        type="text"
        placeholder="e.g. Find Mumbai flight"
        autocomplete="off"
      >

      <div class="action-row">

        <button
          id="start-btn"
          class="start-btn"
          type="button"
        >
          Start capture cycle
        </button>

        <button
          id="stop-btn"
          class="stop-btn"
          type="button"
          disabled
        >
          Stop
        </button>

      </div>

    </section>


    <!-- STATUS -->
    <section
      id="status-bar"
      class="status-bar"
    >

      <span
        id="status-dot"
        class="status-dot"
      ></span>

      <span
        id="status-text"
        class="status-text"
      >
        Idle. Enter a task and click start.
      </span>

    </section>


    <!-- METRICS -->
    <section class="metrics">

      <div class="metric">
        <div
          id="pii-count"
          class="metric-number"
        >
          0
        </div>

        <div class="metric-name">
          PII detected
        </div>
      </div>


      <div class="metric">
        <div
          id="redacted-count"
          class="metric-number"
        >
          0
        </div>

        <div class="metric-name">
          Redacted
        </div>
      </div>


      <div class="metric">
        <div
          id="sent-count"
          class="metric-number"
        >
          0
        </div>

        <div class="metric-name">
          Sent to AI
        </div>
      </div>

    </section>


    <!-- PREVIEW -->
    <section class="preview-section">

      <div class="preview-top">

        <div>
          <h2>
            Capture preview
          </h2>

          <p>
            Latest frame before and after redaction
          </p>
        </div>

        <div class="protected">
          <span class="shield">♢</span>
          <span>Protected</span>
        </div>

      </div>


      <div class="preview-label-row">

        <div class="preview-label">
          <span class="preview-dot original"></span>
          Original
        </div>

        <div class="preview-label">
          <span class="preview-dot redacted"></span>
          Redacted
        </div>

      </div>


      <div class="preview-grid">

        <div class="preview-card">

          <img
            id="original-preview"
            class="preview-image"
            alt="Original screenshot"
          >

          <div
            id="original-placeholder"
            class="placeholder"
          >
            Original screenshot
          </div>

        </div>


        <div class="preview-card redacted-card">

          <img
            id="redacted-preview"
            class="preview-image"
            alt="Redacted screenshot"
          >

          <div
            id="redacted-placeholder"
            class="placeholder redacted-placeholder"
          >
            Redacted screenshot
          </div>

        </div>

      </div>

    </section>


    <!-- FOOTER -->
    <footer class="footer">

      <span>
        Obscura
      </span>

      <span>
        P1 capture pipeline
      </span>

    </footer>

  </div>

  <script src="popup.js"></script>

</body>
</html>
