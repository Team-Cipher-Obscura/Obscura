<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Obscura</title>

  <link rel="stylesheet" href="popup.css" />
</head>

<body>

  <div class="popup-container">

    <!-- ================= HEADER ================= -->
    <header class="header">

      <div class="brand">

        <div class="logo-wrapper">
          <img
            src="assets/obscura-logo.jpeg"
            alt="Obscura"
            class="logo"
          />
        </div>

        <div class="brand-text">
          <h1>Obscura</h1>
          <p>Privacy-preserving browser agent</p>
        </div>

      </div>

      <div
        id="header-status-dot"
        class="header-status-dot idle"
      ></div>

    </header>


    <!-- ================= TASK ================= -->
    <section class="task-section">

      <label
        for="task-input"
        class="section-label"
      >
        Task
      </label>

      <input
        id="task-input"
        type="text"
        autocomplete="off"
        placeholder="e.g. Find Mumbai flight"
      />

      <div class="task-buttons">

        <button
          id="start-btn"
          class="start-btn"
          type="button"
        >
          Start capture cycle
        </button>

        <button
          id="stop-btn"
          class="stop-btn"
          type="button"
          disabled
        >
          Stop
        </button>

      </div>

    </section>


    <!-- ================= STATUS ================= -->
    <section
      id="status-bar"
      class="status-bar idle"
    >

      <span
        id="status-dot"
        class="status-dot"
      ></span>

      <span id="status-text">
        Idle. Enter a task and click start.
      </span>

    </section>


    <!-- ================= COUNTERS ================= -->
    <section class="metrics">

      <div class="metric">

        <div
          id="pii-count"
          class="metric-value"
        >
          0
        </div>

        <div class="metric-label">
          PII detected
        </div>

      </div>


      <div class="metric">

        <div
          id="redacted-count"
          class="metric-value"
        >
          0
        </div>

        <div class="metric-label">
          Redacted
        </div>

      </div>


      <div class="metric">

        <div
          id="sent-count"
          class="metric-value"
        >
          0
        </div>

        <div class="metric-label">
          Sent to AI
        </div>

      </div>

    </section>


    <!-- ================= PREVIEW ================= -->
    <section class="preview-section">

      <div class="preview-header">

        <div>
          <h2>Capture preview</h2>

          <p>
            Latest frame before and after redaction
          </p>
        </div>

        <div class="protected-badge">

          <span class="shield-icon">
            ♢
          </span>

          Protected

        </div>

      </div>


      <!-- Preview labels -->
      <div class="preview-labels">

        <div class="preview-label original-label">
          <span class="label-dot"></span>
          Original
        </div>

        <div class="preview-label redacted-label">
          <span class="label-dot"></span>
          Redacted
        </div>

      </div>


      <!-- Preview images -->
      <div class="preview-grid">

        <!-- Original -->
        <div class="preview-card">

          <img
            id="original-preview"
            class="preview-image hidden"
            alt="Original screenshot"
          />

          <div
            id="original-placeholder"
            class="preview-placeholder"
          >
            <span>Original screenshot</span>
          </div>

        </div>


        <!-- Redacted -->
        <div class="preview-card redacted-card">

          <img
            id="redacted-preview"
            class="preview-image hidden"
            alt="Redacted screenshot"
          />

          <div
            id="redacted-placeholder"
            class="preview-placeholder redacted-placeholder"
          >
            <span>Redacted screenshot</span>
          </div>

        </div>

      </div>

    </section>


    <!-- ================= FOOTER ================= -->
    <footer class="footer">

      <span>Obscura</span>

      <span>P1 capture pipeline</span>

    </footer>

  </div>


  <script src="popup.js"></script>

</body>
</html>
