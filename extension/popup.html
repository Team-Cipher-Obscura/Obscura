<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=420, initial-scale=1.0"
  >

  <title>Obscura</title>

  <link
    rel="stylesheet"
    href="popup.css"
  >

</head>


<body>

  <main class="popup">


    <!-- ================= HEADER ================= -->

    <header class="header">

      <div class="brand">

        <img
          id="obscura-logo"
          class="logo"
          src="assets/obscura-logo.png"
          alt="Obscura"
        >

        <div class="brand-copy">

          <div class="brand-title">
            Obscura
          </div>

          <div class="brand-subtitle">
            Privacy-preserving browser agent
          </div>

        </div>

      </div>


      <span
        id="header-dot"
        class="header-dot"
      ></span>

    </header>


    <!-- ================= TASK ================= -->

    <section class="task-section">

      <label
        class="task-label"
        for="task-input"
      >
        Task
      </label>


      <input
        id="task-input"
        type="text"
        autocomplete="off"
        placeholder="e.g. Find Mumbai flight"
      >


      <div class="action-row">

        <button
          id="start-btn"
          class="start-btn"
          type="button"
        >
          Start capture cycle
        </button>


        <button
          id="stop-btn"
          class="stop-btn"
          type="button"
          disabled
        >
          Stop
        </button>

      </div>

    </section>


    <!-- ================= STATUS ================= -->

    <section
      id="status-bar"
      class="status-bar"
    >

      <span
        id="status-dot"
        class="status-dot"
      ></span>


      <span
        id="status-text"
        class="status-text"
      >
        Idle. Enter a task and click start.
      </span>

    </section>


    <!-- ================= METRICS ================= -->

    <section class="metrics">


      <div class="metric">

        <div
          id="pii-count"
          class="metric-number"
        >
          0
        </div>

        <div class="metric-name">
          PII detected
        </div>

      </div>


      <div class="metric">

        <div
          id="redacted-count"
          class="metric-number"
        >
          0
        </div>

        <div class="metric-name">
          Redacted
        </div>

      </div>


      <div class="metric">

        <div
          id="sent-count"
          class="metric-number"
        >
          0
        </div>

        <div class="metric-name">
          Sent to AI
        </div>

      </div>

    </section>


    <!-- ================= PREVIEW ================= -->

    <section class="preview-section">


      <div class="preview-heading">

        <div>

          <h2>
            Capture preview
          </h2>

          <p>
            Latest frame before and after redaction
          </p>

        </div>


        <div class="protected-badge">

          <span class="shield">
            ♢
          </span>

          <span>
            Protected
          </span>

        </div>

      </div>


      <div class="preview-labels">


        <div class="preview-label">

          <span
            class="label-dot original-dot"
          ></span>

          Original

        </div>


        <div class="preview-label">

          <span
            class="label-dot redacted-dot"
          ></span>

          Redacted

        </div>

      </div>


      <div class="preview-grid">


        <div class="preview-card">

          <img
            id="original-preview"
            class="preview-image"
            alt="Original screenshot"
          >


          <span
            id="original-placeholder"
            class="preview-placeholder"
          >
            Original screenshot
          </span>

        </div>


        <div
          class="preview-card redacted-card"
        >

          <img
            id="redacted-preview"
            class="preview-image"
            alt="Redacted screenshot"
          >


          <span
            id="redacted-placeholder"
            class="preview-placeholder redacted-placeholder"
          >
            Redacted screenshot
          </span>

        </div>

      </div>

    </section>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

      <span>
        Obscura
      </span>

      <span>
        P1 capture pipeline
      </span>

    </footer>


  </main>


  <script src="popup.js"></script>

</body>

</html>
