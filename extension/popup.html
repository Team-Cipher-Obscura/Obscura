<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Obscura</title>

  <link rel="stylesheet" href="popup.css">
</head>

<body>

  <main class="popup-container">

    <!-- ================= HEADER ================= -->

    <header class="header">

      <div class="brand">

        <div class="logo-wrapper">
          <img
            src="assets/obscura-logo.jpeg"
            alt="Obscura"
            class="logo"
          >
        </div>

        <div class="brand-text">
          <h1>Obscura</h1>
          <p>Privacy-preserving browser agent</p>
        </div>

      </div>

      <span
        id="header-status-dot"
        class="header-status-dot idle"
      ></span>

    </header>


    <!-- ================= TASK ================= -->

    <section class="task-section">

      <label
        for="task-input"
        class="section-label"
      >
        Task
      </label>

      <input
        id="task-input"
        type="text"
        placeholder="e.g. Find Mumbai flight"
        autocomplete="off"
      >

      <div class="task-actions">

        <button
          id="start-btn"
          class="start-btn"
          type="button"
        >
          Start capture cycle
        </button>

        <button
          id="stop-btn"
          class="stop-btn"
          type="button"
          disabled
        >
          Stop
        </button>

      </div>

    </section>


    <!-- ================= STATUS ================= -->

    <section
      id="status-bar"
      class="status-bar idle"
    >

      <span
        id="status-dot"
        class="status-dot"
      ></span>

      <span id="status-text">
        Idle. Enter a task and click start.
      </span>

    </section>


    <!-- ================= METRICS ================= -->

    <section class="metrics">

      <div class="metric">

        <span
          id="pii-count"
          class="metric-value"
        >
          0
        </span>

        <span class="metric-label">
          PII detected
        </span>

      </div>


      <div class="metric">

        <span
          id="redacted-count"
          class="metric-value"
        >
          0
        </span>

        <span class="metric-label">
          Redacted
        </span>

      </div>


      <div class="metric">

        <span
          id="sent-count"
          class="metric-value"
        >
          0
        </span>

        <span class="metric-label">
          Sent to AI
        </span>

      </div>

    </section>


    <!-- ================= CAPTURE PREVIEW ================= -->

    <section class="preview-section">

      <div class="preview-heading">

        <div class="preview-title">

          <h2>Capture preview</h2>

          <p>
            Latest frame before and after redaction
          </p>

        </div>


        <div class="protected-badge">

          <span class="shield-icon">
            ♢
          </span>

          <span>
            Protected
          </span>

        </div>

      </div>


      <!-- Preview labels -->

      <div class="preview-labels">

        <div class="preview-label">

          <span class="label-dot original-dot"></span>

          <span>
            Original
          </span>

        </div>


        <div class="preview-label">

          <span class="label-dot redacted-dot"></span>

          <span>
            Redacted
          </span>

        </div>

      </div>


      <!-- Preview cards -->

      <div class="preview-grid">

        <!-- Original -->

        <div class="preview-card original-card">

          <img
            id="original-preview"
            class="preview-image hidden"
            alt="Original screenshot"
          >

          <div
            id="original-placeholder"
            class="preview-placeholder"
          >
            Original screenshot
          </div>

        </div>


        <!-- Redacted -->

        <div class="preview-card redacted-card">

          <img
            id="redacted-preview"
            class="preview-image hidden"
            alt="Redacted screenshot"
          >

          <div
            id="redacted-placeholder"
            class="preview-placeholder"
          >
            Redacted screenshot
          </div>

        </div>

      </div>

    </section>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

      <span>
        Obscura
      </span>

      <span>
        P1 capture pipeline
      </span>

    </footer>

  </main>


  <script src="popup.js"></script>

</body>
</html>
