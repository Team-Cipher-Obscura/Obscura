<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Obscura</title>

  <style>
    body {
      width: 280px;
      font-family: system-ui, sans-serif;
      padding: 12px;
      margin: 0;
    }

    h1 {
      font-size: 15px;
      margin: 0 0 10px;
    }

    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    button {
      width: 100%;
      padding: 8px;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 8px;
    }

    #stopBtn {
      margin-bottom: 12px;
    }

    #status {
      font-size: 12px;
      line-height: 1.5;
      background: #f4f4f4;
      padding: 8px;
      border-radius: 6px;
      white-space: pre-wrap;
    }

    .counters {
      font-size: 12px;
      margin-top: 8px;
    }

    .counters div {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .preview-section {
      margin-top: 12px;
      font-size: 12px;
    }

    .preview-section strong {
      display: block;
      margin-bottom: 5px;
    }

    .preview {
      width: 100%;
      max-height: 180px;
      object-fit: contain;
      display: block;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fafafa;
    }
  </style>
</head>

<body>

  <h1>Obscura</h1>

  <input
    id="taskInput"
    type="text"
    placeholder="e.g. Find Mumbai flight"
  />

  <button id="startBtn">
    Start capture cycle
  </button>

  <button id="stopBtn">
    Stop capture cycle
  </button>

  <div id="status">
    Idle. Enter a task and click start.
  </div>

  <!-- Privacy counters -->

  <div class="counters">

    <div>
      <span>PII detected</span>
      <span id="piiCount">0</span>
    </div>

    <div>
      <span>Redacted</span>
      <span id="redactedCount">0</span>
    </div>

    <div>
      <span>Sent to AI</span>
      <span id="sentCount">0</span>
    </div>

  </div>


  <!-- Original screenshot -->

  <div class="preview-section">

    <strong>Original screenshot</strong>

    <img
      id="originalPreview"
      class="preview"
      alt="Original screenshot"
    />

  </div>


  <!-- Redacted screenshot -->

  <div class="preview-section">

    <strong>Redacted screenshot</strong>

    <img
      id="redactedPreview"
      class="preview"
      alt="Redacted screenshot"
    />

  </div>


  <script src="popup.js"></script>

</body>
</html>
