<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyBharat — Search flights</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body data-page="search">

<nav class="site-nav" aria-label="Main">
  <div class="container">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true"></span>
      SkyBharat
    </a>
    <div class="nav-links">
      <a href="index.html" aria-current="page">Search</a>
      <a href="login.html">Log in</a>
    </div>
  </div>
</nav>

<header class="hero">
  <div class="container">
    <h1>Search flights across India</h1>
    <p class="lead">Compare fares across airlines and book in a few taps.</p>

    <form id="searchForm" class="card search-panel" autocomplete="off">
      <div class="search-grid">
        <div class="field combo" style="margin-bottom:0;">
          <label for="fromCity">From</label>
          <input type="text" id="fromCity" name="from" placeholder="Delhi (DEL)"
                 role="combobox" aria-expanded="false" aria-controls="fromList"
                 aria-autocomplete="list" autocomplete="off">
          <ul id="fromList" class="combo-list" role="listbox" aria-label="Departure city suggestions" hidden></ul>
        </div>

        <div class="field combo" style="margin-bottom:0;">
          <label for="toCity">To</label>
          <input type="text" id="toCity" name="to" placeholder="Mumbai (BOM)"
                 role="combobox" aria-expanded="false" aria-controls="toList"
                 aria-autocomplete="list" autocomplete="off">
          <ul id="toList" class="combo-list" role="listbox" aria-label="Arrival city suggestions" hidden></ul>
        </div>

        <div class="field" style="margin-bottom:0;">
          <label for="departDate">Departure date</label>
          <input type="date" id="departDate" name="departDate">
        </div>

        <button type="submit" class="btn btn-primary">Search flights</button>
      </div>
    </form>
  </div>
</header>

<section class="results-section" aria-live="polite">
  <div class="container">
    <div id="resultsSection" hidden>
      <div class="results-meta">
        <span id="resultsMeta"></span>
        <span>Sorted by price</span>
      </div>
      <div id="resultsList"></div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    Mock site for local testing only — no real flights, payments, or accounts.
  </div>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
